<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0066cc">
  <meta name="description" content="카메라의 선택 영역에서 움직임을 감지하여 랩타임을 기록하는 웹앱">
  <title>LapTimeCheck</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js?v=20260915-5"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">본문으로 바로가기</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="https://nukcanon.github.io/nukcanon/" aria-label="Nukcanon 홈">
        <span class="brand-copy">
          <strong>Nukcanon</strong>
          <small>Project Archive</small>
        </span>
      </a>
      <nav aria-label="주요 메뉴">
        <a class="home-link" href="https://nukcanon.github.io/nukcanon/">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9Z"/></svg>
          <span>Home</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="workspace" class="workspace">
    <section class="app-heading" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">CAMERA MOTION TIMER</p>
        <h1 id="page-title">랩타임 측정기</h1>
      </div>
      <div class="status-pill" id="statusPill" data-state="loading" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">카메라 대기</span>
      </div>
    </section>

    <div class="app-grid">
      <section class="camera-card" aria-label="카메라 및 감지 영역">
        <div class="camera-stage" id="cameraStage">
          <video id="cameraVideo" autoplay muted playsinline></video>
          <canvas id="roiCanvas" aria-label="드래그하여 움직임 감지 영역 선택"></canvas>
          <div class="camera-empty" id="cameraEmpty">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9H3V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <strong>카메라를 시작해주세요</strong>
            <span>권한 허용 후 화면에서 감지 영역을 드래그하세요.</span>
          </div>
          <div class="timer-display" id="timerDisplay" aria-live="off">00:00.00</div>
          <div class="motion-meter" aria-label="움직임 감지 비율">
            <span id="motionValue">0.0%</span>
            <span class="meter-track"><span id="motionBar"></span></span>
          </div>
        </div>

        <div class="primary-controls">
          <button class="button button-primary" id="cameraButton" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9H3V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            카메라 시작
          </button>
          <button class="button button-accent" id="measureButton" type="button" disabled>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 4h6M12 4v3m6.5 1.5 1.5-1.5M12 8a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/><path d="M12 11v3l2 1"/></svg>
            측정 시작
          </button>
          <button class="button button-secondary" id="clearButton" type="button">랩타임 리셋</button>
          <button class="button button-secondary" id="debugButton" type="button" aria-pressed="false">감지 상태</button>
        </div>
        <p class="camera-help" id="cameraHelp">카메라를 켠 다음, 영상 위에서 자동차가 통과할 영역을 드래그하세요.</p>
      </section>

      <aside class="side-column">
        <section class="panel lap-panel" aria-labelledby="laps-title">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">RECORDS</p>
              <h2 id="laps-title">랩타임</h2>
            </div>
            <span class="lap-count" id="lapCount">0 LAP</span>
          </div>
          <ol class="lap-list" id="lapList">
            <li class="empty-row" id="emptyLaps">아직 기록된 랩타임이 없습니다.</li>
          </ol>
        </section>

        <section class="panel settings-panel" aria-labelledby="settings-title">
          <div class="panel-heading compact">
            <div>
              <p class="panel-kicker">DETECTION</p>
              <h2 id="settings-title">감지 설정</h2>
            </div>
            <button class="icon-button" id="resetBackgroundButton" type="button" title="배경 다시 학습" aria-label="배경 다시 학습">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
            </button>
          </div>

          <label class="field range-field" for="sensitivityInput">
            <span><strong>감지 기준</strong><output id="sensitivityOutput">20%</output></span>
            <input id="sensitivityInput" type="range" min="1" max="80" step="1" value="20">
            <small>Android 앱과 같은 변화 면적(%) 기준입니다. 낮을수록 민감합니다.</small>
          </label>

          <label class="field range-field" for="historyInput">
            <span><strong>배경 History</strong><output id="historyOutput">1000</output></span>
            <input id="historyInput" type="range" min="100" max="5000" step="100" value="1000">
            <small>값이 높을수록 배경 변화에 천천히 적응합니다.</small>
          </label>

          <label class="field" for="cooldownInput">
            <span><strong>재감지 대기시간</strong></span>
            <select id="cooldownInput">
              <option value="1000">1초</option>
              <option value="1500">1.5초</option>
              <option value="2000" selected>2초</option>
              <option value="3000">3초</option>
              <option value="5000">5초</option>
            </select>
          </label>

          <label class="field" for="cameraSelect">
            <span><strong>카메라 선택</strong></span>
            <select id="cameraSelect" disabled>
              <option value="">기본 후면 카메라</option>
            </select>
          </label>

          <div class="debug-panel" id="debugPanel" hidden>
            <div class="debug-heading"><strong>감지 마스크</strong><span id="debugSize">—</span></div>
            <canvas id="debugCanvas"></canvas>
          </div>
        </section>
      </aside>
    </div>

    <canvas id="processingCanvas" hidden></canvas>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
